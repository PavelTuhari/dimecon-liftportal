{% extends "admin/_layout.html" %}
{% block heading %}Аудит{% endblock %}
{% block content %}
<div class="table-wrap"><table><thead><tr><th>Когда</th><th>Кто</th><th>Действие</th><th>Объект</th><th>Детали</th></tr></thead><tbody>
{% for r in rows %}<tr><td class="small">{{ r.created_at|dt }}</td><td>{{ r.user_id }}</td><td><b>{{ r.action }}</b></td><td>{{ r.entity }} {{ r.entity_id or '' }}</td><td class="small muted">{{ r.details }}</td></tr>{% else %}<tr><td colspan="5" class="center muted">Записей нет</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
