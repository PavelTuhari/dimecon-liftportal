{% extends "admin/_layout.html" %}
{% from "_macros.html" import csrf with context %}
{% block heading %}Новый объект{% endblock %}
{% block content %}
<form method="post" class="card" style="max-width:820px">{{ csrf() }}
  <div class="grid g2">
    <div class="field"><label>Название *</label><input name="name" required placeholder="ЖК «Рышкановка», монтаж крана"></div>
    <div class="field"><label>Код объекта</label><input name="code" placeholder="OBJ-014"></div>
  </div>
  <div class="grid g2">
    <div class="field"><label>Партнёр B2B</label><select name="partner_id"><option value="">— не выбран —</option>
      {% for p in partners %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div>
    <div class="field"><label>Клиент</label><select name="contact_id"><option value="">— не выбран —</option>
      {% for c in contacts %}<option value="{{ c.id }}">{{ c.company or c.name }}</option>{% endfor %}</select></div>
  </div>
  <div class="field"><label>Адрес объекта</label><input name="address" placeholder="Кишинёв, ул. Индустриальная, 46"></div>
  <div class="grid g2">
    <div class="field"><label>Руководитель</label><select name="manager_id"><option value="">— не назначен —</option>
      {% for u in users %}<option value="{{ u.id }}">{{ u.full_name or u.email }}</option>{% endfor %}</select></div>
    <div class="field"><label>Создать по шаблону</label><select name="template_id"><option value="">— без шаблона —</option>
      {% for t in templates %}<option value="{{ t.id }}">{{ t.name }}</option>{% endfor %}</select></div>
  </div>
  <div class="grid g4">
    <div class="field"><label>План выручки</label><input name="budget_amount" type="number" step="0.01" value="0"></div>
    <div class="field"><label>План затрат</label><input name="planned_cost" type="number" step="0.01" value="0"></div>
    <div class="field"><label>Себестоимость часа</label><input name="hour_cost" type="number" step="0.01" value="0"></div>
    <div class="field"><label>Ставка часа для счёта</label><input name="hour_rate" type="number" step="0.01" value="0"></div>
  </div>
  <div class="grid g2">
    <div class="field"><label>Начало</label><input name="starts_at" type="date" value="{{ now.strftime('%Y-%m-%d') }}"></div>
    <div class="field"><label>Сдача</label><input name="ends_at" type="date"></div>
  </div>
  <div class="field"><label>Заметки</label><textarea name="notes" rows="3"></textarea></div>
  <label class="small"><input type="checkbox" name="is_template" value="1"> это шаблон объекта (задачи и этапы будут копироваться)</label>
  <div class="flex mt"><button class="btn primary">Создать объект</button>
    <a class="btn" href="{{ url_for('erp.projects') }}">Отмена</a></div>
</form>
{% endblock %}
